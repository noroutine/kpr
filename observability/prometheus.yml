global:
  scrape_interval: 5s

scrape_configs:
  - job_name: kpr
    metrics_path: /metrics/prometheus
    static_configs:
      - targets: ["kpr:9300"]

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  # Registry debug endpoint (http.debug in registry-config.yml). The
  # registry lives in the base stack with port 5001 published, so this
  # job resolves whenever the overlay runs on top of it.
  - job_name: registry
    metrics_path: /metrics
    static_configs:
      - targets: ["registry:5001"]
