global:
  scrape_interval: 5s

scrape_configs:
  - job_name: kpr
    metrics_path: /metrics/prometheus
    static_configs:
      - targets: ["kpr:9300"]

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  # Registry debug endpoint (http.debug in registry-config.yml).
  # Scraped over kpr-net — the debug port is never published to
  # the host, so this job resolves only inside the overlay.
  - job_name: registry
    metrics_path: /metrics
    static_configs:
      - targets: ["registry:5001"]
