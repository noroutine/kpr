version: "2"

run:
  timeout: 5m

# Pinned explicitly (rather than relying on whatever golangci-lint's
# defaults happen to be) so a golangci-lint upgrade can't silently start
# enabling stricter linters and breaking CI, and so `make lint`/`just lint`
# locally and CI always run the exact same set. v1's separate gosimple
# linter was merged into staticcheck in v2, hence its absence here.
linters:
  default: none
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    - misspell
  exclusions:
    rules:
      # The proof sealed() witnesses carry `return` on purpose: an
      # empty body is 0 coverable statements (0.0% even when
      # executed), so the "redundant" return is the load-bearing
      # coverage signal. Scoped to that one check in that package.
      - path: 'internal/proof/.*\.go$'
        linters:
          - staticcheck
        text: 'S1023'

formatters:
  enable:
    - gofmt
    - goimports
