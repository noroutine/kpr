# Plain OCI distribution configuration for the kpr dev stack.
# Referenced as /etc/distribution/config.yml by the `registry` service
# in docker-compose.yml.
#
# Push/pull/delete envelopes -> the kpr receiver, which tracks rows in
# redis (see POST /events and docs/PLAN.md).
notifications:
  endpoints:
    - name: kpr
      url: http://kpr:8080/events
      timeout: 1s
      threshold: 5
      backoff: 1s

version: 0.1

storage:
  delete:
    # kpr sweeps expired manifests: deletes must be enabled or every
    # DELETE 405s with UNSUPPORTED.
    enabled: true
  filesystem:
    rootdirectory: /var/lib/registry

http:
  addr: :5000
  host: https://localhost:5000
