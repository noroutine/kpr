name: CI

# GitHub mirror of the Forgejo pipeline: same make gates, same
# triggers. The two coexist — Forgejo reads .forgejo, GitHub
# reads .github, neither knows the other. Publishing differs:
# tags release to ghcr.io here, to nrtn.dev over there.
on:
  push:
    branches: [ master, main ]
    tags:
      - 'v*'
      - '*.*.*'
  pull_request:
    branches: [ master, main ]

jobs:
  test:
    name: Test & Build
    runs-on: ubuntu-latest

    steps:
    - name: Check out code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.27'

    - name: Install CI prerequisites
      run: |
        make install-ci-prereqs
        echo "$(go env GOPATH)/bin" >> $GITHUB_PATH

    - name: Verify dependencies
      run: make verify

    - name: Check formatting
      run: make fmt-check

    - name: Lint
      run: make lint

    - name: Run tests with coverage
      run: make coverage

    - name: Build
      run: make build

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Build and test Docker image
      run: |
        make docker-build
        make test-docker
