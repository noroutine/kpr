name: CI

# GitHub mirror of the Forgejo pipeline: same make gates, same
# triggers. The two coexist — Forgejo reads .forgejo, GitHub
# reads .github, neither knows the other. Publishing differs:
# tags release to ghcr.io here, to nrtn.dev over there.
on:
  push:
    branches: [ master, main ]
    tags:
      - 'v*'
      - '*.*.*'
  pull_request:
    branches: [ master, main ]

# id-token: write mints the OIDC token the Codecov upload uses
# (tokenless, no secrets); contents: read checks the code out.
permissions:
  contents: read
  id-token: write

jobs:
  test:
    name: Test & Build
    runs-on: ubuntu-latest

    steps:
    - name: Check out code
      uses: actions/checkout@v7
      with:
        fetch-depth: 0

    - name: Set up Go
      uses: actions/setup-go@v7
      with:
        go-version: '1.27'

    - name: Install CI prerequisites
      run: |
        make install-ci-prereqs
        echo "$(go env GOPATH)/bin" >> $GITHUB_PATH

    - name: Verify dependencies
      run: make verify

    - name: Check formatting
      run: make fmt-check

    - name: Lint
      run: make lint

    - name: Run tests with coverage
      run: make coverage

    # Tokenless OIDC upload (public repo, no secrets): codecov
    # draws the badge from here. Soft-fail so a codecov outage
    # never reds the gate — the local coverage report already ran.
    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v7
      with:
        files: ./coverage.out
        use_oidc: true
        fail_ci_if_error: false
        verbose: true

    - name: Validate Codecov config
      run: make codecov-validate

    - name: Build
      run: make build

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4

    - name: Build and test Docker image
      run: |
        make docker-build
        make test-docker
