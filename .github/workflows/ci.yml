name: CI

# GitHub mirror of the Forgejo pipeline: same make gates, same
# triggers. The two coexist — Forgejo reads .forgejo, GitHub
# reads .github, neither knows the other. Publishing differs:
# tags release to ghcr.io here, to nrtn.dev over there.
on:
  push:
    branches: [ master, main ]
    tags:
      - 'v*'
      - '*.*.*'
  pull_request:
    branches: [ master, main ]

# id-token: write mints the OIDC token the Codecov upload uses
# (tokenless, no secrets); contents: read checks the code out.
permissions:
  contents: read
  id-token: write

jobs:
  test:
    name: Test & Build
    runs-on: ubuntu-latest
    # actions: write stashes the coverage report for the codecov
    # job below (artifact handoff, no test re-run there).
    permissions:
      contents: read
      actions: write

    steps:
    - name: Check out code
      uses: actions/checkout@v7
      with:
        fetch-depth: 0

    - name: Set up Go
      uses: actions/setup-go@v7
      with:
        go-version: '1.27'

    - name: Install CI prerequisites
      run: |
        make install-ci-prereqs
        echo "$(go env GOPATH)/bin" >> $GITHUB_PATH

    - name: Verify dependencies
      run: make verify

    - name: Check formatting
      run: make fmt-check

    - name: Lint
      run: make lint

    - name: Run tests with coverage
      run: make coverage

    - name: Stash coverage report
      uses: actions/upload-artifact@v4
      with:
        name: coverage-out
        path: coverage.out
        retention-days: 1

    - name: Build
      run: make build

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4

    - name: Build and test Docker image
      run: |
        make docker-build
        make test-docker

  # Own job, off the test path: an upload outage reds THIS job
  # instead of hiding green inside Test & Build (fail_ci_if_error
  # soft-failed the incident away last night). The required
  # codecov/project and codecov/patch statuses only post off a
  # real upload, so this job failing loud is the signal — not a
  # second Test & Build run, hence the artifact handoff above.
  codecov:
    name: Codecov upload
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read
      id-token: write
      actions: read

    steps:
    - name: Check out code
      uses: actions/checkout@v7

    - name: Fetch coverage report
      uses: actions/download-artifact@v4
      with:
        name: coverage-out

    # Tokenless OIDC upload (public repo, no secrets): codecov
    # draws the badge from here. Loud on purpose — see above.
    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v7
      with:
        files: ./coverage.out
        use_oidc: true
        fail_ci_if_error: true
        verbose: true

    - name: Validate Codecov config
      run: make codecov-validate
