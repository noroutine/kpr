# TLS file provider: the local certbot identity traefik
# terminates with. Staged outside the repo (certbot owns it);
# the compose file only mounts it read-only.
tls:
  certificates:
    - certFile: /certbot/live/mystic-raven-13.topteil.dev/fullchain.pem
      keyFile: /certbot/live/mystic-raven-13.topteil.dev/privkey.pem
