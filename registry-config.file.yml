# OCI distribution configuration for the kpr file-backend dev stack
# (docker-compose.yml). Twin of registry-config.yml minus redis: the
# blobdescriptor cache is process-local inmemory, so this stack needs
# no shared instance at all. Referenced as
# /etc/distribution/config.yml by the `registry` service.
notifications:
  endpoints:
    - name: kpr
      url: http://kpr:8080/events
      timeout: 1s
      threshold: 5
      backoff: 1s

version: 0.1

log:
  level: info
  fields:
    service: registry
    environment: core

storage:
  delete:
    # kpr sweeps expired manifests: deletes must be enabled or every
    # DELETE 405s with UNSUPPORTED.
    enabled: true
  # No `cache:` section on purpose: without `blobdescriptor` every
  # blob stat hits the filesystem, so gc deletions are visible
  # immediately — no stale-descriptor phantoms, no restart needed
  # before re-push (see docs/GC.md). Speed doesn't matter on this
  # dev stack; the redis stack's registry-config.yml keeps the
  # shared cache for deployments where warm restarts matter.
  filesystem:
    rootdirectory: /var/lib/registry
  maintenance:
    uploadpurging:
      # On: reaps orphaned blob-upload sessions (_uploads/<uuid>)
      # older than age. This is disk, not rows — kpr's partial
      # policy reaps digest-less ROWS, a different thing entirely:
      # it never touches _uploads, and purging never touches
      # tracked tags, so nothing runs under anyone's feet. Off
      # piles abandoned sessions no collector or prune step
      # removes (uploads hold partial bytes, never empty dirs).
      enabled: true
      age: 24h
      interval: 1h
      dryrun: false
  tag:
    # Tag-reference lookup concurrency on manifest delete (each delete
    # scans the repo's tags for the digest); 0 would mean GOMAXPROCS.
    concurrencylimit: 8

http:
  addr: :5000
  # Relative Location headers (see docs/EDGE.md, Location guard):
  # kpr fronts this registry as its edge, so upstream URLs must
  # never name the backend. Never set `host` alongside — a set
  # `host` silently overrides this knob (absolute URLs always).
  relativeurls: true
  debug:
    addr: :5001
    prometheus:
      enabled: true
      path: /metrics
  headers:
    X-Content-Type-Options: [nosniff]

#auth:
#  htpasswd:
#    realm: basic-realm
#    path: /etc/distribution/htpasswd

health:
  storagedriver:
    enabled: true
    interval: 10s
    threshold: 3
