services:
  kpr:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VERSION: ${VERSION:-dev}
        COMMIT: ${COMMIT:-unknown}
        BUILD_TIME: ${BUILD_TIME:-unknown}
    image: nrtn.dev/catalyst/kpr:${VERSION:-latest}
    container_name: kpr
    ports:
      - "8080:8080"   # Application server
      - "9300:9300"   # Management console
      # The registry's old edge: kpr fronts :5000 now (RelativeURLs
      # proof gates it at open — absolute backend Locations close
      # it loudly, never a boot refusal).
      # Needs localhost:5000 free: macOS AirPlay Receiver squats it when
      # enabled (answers 403 with Server: AirTunes) — keep that off.
      - "127.0.0.1:5000:5000"
    environment:
      # Server configuration
      - "KPR_MANAGEMENT_HOST=::"
      - "KPR_MANAGEMENT_PORT=9300"
      - "KPR_APP_HOST=::"
      - "KPR_APP_PORT=8080"
      # Edge proxy listen address (default :5000, said out loud:
      # this port used to belong to the registry below).
      - "KPR_EDGE_ADDR=:5000"

      # State backend: FileStore on the bind-mounted ./kpr (see
      # docs/STORES.md). KPR_STORE_DIR must be absolute — the M3
      # derivation refuses to guess, and compose can't interpolate
      # a host path into the container anyway.
      - "KPR_STORE=file"
      - "KPR_STORE_DIR=/var/lib/kpr"

      # Registry peer (sweeper deletes, reap reads catalog)
      - "KPR_REGISTRY_URL=http://registry:5000"
      # Dry-run by default: one-shots (gc, reap, sweep, backfill)
      # plan without touching anything unless --no-dry-run
      # (or KPR_CLI_NO_DRY_RUN=true) arms them.
      # Checked clock: HTTPS works wherever the web does (the binary
      # default is local trust). ntp is precise but often
      # egress-blocked; local skips the check entirely.
      - "KPR_TIME_METHOD=https"

      # OpenTelemetry (optional)
      - OTEL_ENABLED=false
      # - OTEL_EXPORTER_OTLP_ENDPOINT=tempo:4317
      # - OTEL_SERVICE_NAME=kpr
      # - OTEL_ENVIRONMENT=production
      # - OTEL_SERVICE_VERSION=${VERSION:-dev}
    volumes:
      # FileStore state, bind-mounted so the operator can watch it
      # breathe: rows/ ring/ locks/ straight on the host. `make up`
      # creates ./kpr owned by you, so the container's kpr user
      # (uid 1000) can write without a chown dance. Git-ignored.
      - ./kpr:/var/lib/kpr
      # GC shares the registry's store: config read-only, blob data
      # read-write. `make gc` runs the stock collector (embedded in
      # the kpr image) against these after taking the file lock.
      - ./registry-config.file.yml:/etc/distribution/config.yml:ro
      - registry-data:/var/lib/registry
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:9300/health"]
      interval: 30s
      timeout: 3s
      start_period: 5s
      retries: 3
    networks:
      - kpr-net

  # Plain OCI distribution registry that kpr companions.
  # Notification hooks (-> kpr) feed the receiver; retention policies
  # are kpr-side (reap marks, sweep deletes). See
  # registry-config.file.yml, the redis-less twin of the redis
  # stack's registry-config.yml (no blobdescriptor cache at all —
  # no shared instance to protect here, and gc deletions read
  # back true immediately).
  registry:
    image: registry:3
    container_name: kpr-registry
    # Same uid as kpr (1000): the blob store is shared with the kpr
    # container for `make gc`, so both writers must own it. Fresh
    # named volumes arrive root-owned; `make up` / `just up` claims
    # the store (CLAIM_STORE recipe), then restarts are clean.
    user: "1000:1000"
    ports:
      # The registry's :5000 stays private to kpr-net now — kpr
      # fronts it (see its ports above). Debug + prometheus
      # (/metrics) from the config's http.debug block; scraped by
      # the observability overlay.
      - "127.0.0.1:5001:5001"
    volumes:
      - ./registry-config.file.yml:/etc/distribution/config.yml:ro
      - registry-data:/var/lib/registry
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:5000/v2/"]
      interval: 30s
      timeout: 3s
      start_period: 5s
      retries: 3
    networks:
      - kpr-net

networks:
  kpr-net:
    driver: bridge

volumes:
  registry-data:
