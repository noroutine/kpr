name: CI

on:
  push:
    branches: [ master, main ]
    tags:
      - 'v*'
      - '*.*.*'
  pull_request:
    branches: [ master, main ]

jobs:
  test:
    name: Test & Build
    runs-on: ubuntu-latest

    steps:
    - name: Check out code
      uses: actions/checkout@v7
      with:
        fetch-depth: 0

    - name: Set up Go
      uses: actions/setup-go@v7
      with:
        go-version: '1.27'

    # Tools come from the module proxy (go install), not release
    # tarballs — the latter failed checksum verification on these
    # runners. With the tools present, lint/test run full strength
    # instead of their go vet / go test fallbacks.
    - name: Install CI prerequisites
      run: |
        make install-ci-prereqs
        echo "$(go env GOPATH)/bin" >> $GITHUB_PATH

    - name: Verify dependencies
      run: make verify

    - name: Check formatting
      run: make fmt-check

    - name: Lint
      run: make lint

    - name: Run tests with coverage
      run: make coverage

    - name: Validate Codecov config
      run: make codecov-validate

    - name: Build
      run: make build

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4

    - name: Build and test Docker image
      run: |
        make docker-build
        make test-docker

  # Dev images: every branch push that passes `test` ships a
  # hash-tagged multiplatform image to cr.noroutine.me — no
  # release bureaucracy, no binaries, no Forgejo packages. Hash
  # tags never match the version regex, so `latest` never moves.
  dev-image:
    name: Dev image
    runs-on: ubuntu-latest
    needs: test
    if: ${{ !startsWith(github.ref, 'refs/tags/') }}

    steps:
    - name: Check out code
      uses: actions/checkout@v7
      with:
        fetch-depth: 0

    - name: Set up Go
      uses: actions/setup-go@v7
      with:
        go-version: '1.27'

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4

    - name: Setup Docker config
      run: |
        mkdir -p ~/.docker
        echo "${{ secrets.DOCKER_CFG }}" | base64 -d > ~/.docker/config.json
        chmod 600 ~/.docker/config.json

    - name: Build and push hash-tagged image
      run: make docker-build-multiplatform DOCKER_REGISTRY=cr.noroutine.me/catalyst VERSION=$(git rev-parse --short HEAD)

  # Release images: tags only, same shape as dev (image to
  # cr.noroutine.me, no binaries, no formal release). A version
  # tag additionally moves `latest`.
  release:
    name: Release image
    runs-on: ubuntu-latest
    needs: test
    if: startsWith(github.ref, 'refs/tags/')

    steps:
    - name: Check out code
      uses: actions/checkout@v7
      with:
        fetch-depth: 0

    - name: Set up Go
      uses: actions/setup-go@v7
      with:
        go-version: '1.27'

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4

    - name: Setup Docker config
      run: |
        mkdir -p ~/.docker
        echo "${{ secrets.DOCKER_CFG }}" | base64 -d > ~/.docker/config.json
        chmod 600 ~/.docker/config.json

    - name: Build and push tag image
      run: make docker-build-multiplatform DOCKER_REGISTRY=cr.noroutine.me/catalyst VERSION=${{ github.ref_name }}
