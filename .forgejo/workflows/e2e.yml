name: Browser E2E

# Per-push like the unit suite: web-build plus the browser run
# take minutes, and the suite stays green — cheap enough to
# gate on. Manual dispatch stays for on-demand runs.
on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  e2e:
    name: Playwright (chromium)
    runs-on: ubuntu-latest

    steps:
    - name: Check out code
      uses: actions/checkout@v7
      with:
        fetch-depth: 0

    - name: Set up Go
      uses: actions/setup-go@v7
      with:
        go-version-file: .go-version

    # Single step: web-build runs as a prerequisite of the
    # target itself (and self-provisions the mise toolchain via
    # bootstrap), so the suite stays correct standalone with no
    # toolchain setup here.
    - name: Run browser suite
      run: make web-e2e
