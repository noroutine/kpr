name: Browser E2E

# Per-push like the unit suite: web-build plus the browser run
# take minutes, and the suite stays green — cheap enough to
# gate on. Manual dispatch stays for on-demand runs.
on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  e2e:
    name: Playwright (chromium)
    runs-on: ubuntu-latest

    steps:
    - name: Check out code
      uses: actions/checkout@v7
      with:
        fetch-depth: 0

    - name: Set up Go
      uses: actions/setup-go@v7
      with:
        go-version-file: .go-version

    # Single toolchain for local and CI: versions live in
    # mise.toml, installed here straight from the vendor.
    - name: Set up mise
      run: |
        curl -fsSL https://mise.run | sh
        echo "$HOME/.local/bin" >> $GITHUB_PATH
        echo "$HOME/.local/share/mise/shims" >> $GITHUB_PATH

    - name: Install toolchain
      run: mise install

    # Single step: web-build runs as a prerequisite of the
    # target itself, so the suite stays correct standalone.
    - name: Run browser suite
      run: make web-e2e
