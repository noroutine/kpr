name: Mutation

on:
  workflow_dispatch:

jobs:
  mutation:
    name: Mutation testing
    runs-on: ubuntu-latest

    steps:
    - name: Check out code
      uses: actions/checkout@v7
      with:
        fetch-depth: 0

    - name: Set up Go
      uses: actions/setup-go@v7
      with:
        go-version: '1.27'

    - name: Install gremlins
      run: |
        go install github.com/go-gremlins/gremlins/cmd/gremlins@v0.6.0
        echo "$(go env GOPATH)/bin" >> $GITHUB_PATH

    # Same gate as `make mutation` locally (efficacy + mutant coverage
    # thresholds inside the target): manual only, minutes per run, never
    # on the per-push path.
    - name: Run mutation testing
      run: make mutation
